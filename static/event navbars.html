<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Booking Navbar</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Navbar Container */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    padding: 15px 40px;
}

/* Logo */
.logo {
    color: #fff;
    font-size: 22px;
    font-weight: bold;
}

/* Nav Links */
.nav-links {
    list-style: none;
    display: flex;
    gap: 25px;
}

.nav-links li {
    display: inline;
}

.nav-links a {
    text-decoration: none;
    color: #fff;
    font-size: 16px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #ff4d4d;
}

/* Book Button */
.book-btn {
    background: #ff4d4d;
    padding: 8px 15px;
    border-radius: 5px;
}

/* Mobile Menu */
.menu-toggle {
    display: none;
    font-size: 25px;
    color: white;
    cursor: pointer;
}

/* Responsive */
@media(max-width: 768px){
    .nav-links {
        position: absolute;
        right: 0;
        top: 60px;
        background: #111;
        flex-direction: column;
        width: 200px;
        display: none;
        padding: 20px;
    }

    .nav-links.active {
        display: flex;
    }

    .menu-toggle {
        display: block;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">🎟️ EventBook</div>

    <ul class="nav-links" id="navLinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">Events</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#" class="book-btn">Book Ticket</a></li>
    </ul>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
</nav>

<script>
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>

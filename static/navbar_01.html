<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav bar variation</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: antiquewhite;
        }
        .nav_container{
            margin-bottom: 40px;
        }
        h2{
            margin-bottom: 20PX;
        }
        .nav1{
            
            background-color: #f8f9fa;
            padding: 10px;
        }
        .nav1 ul{
            list-style-type: none;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;   
        }
        .nav1 li{
            display: inline;
        }
        .nav1 a {
        margin-top: 20px;
            text-decoration: none;
            color: white;
            background-color: orange;
            padding: 5px 15px;
            position: relative;
        

            }
            .nav1 a::after {
                content: "abc";
                position: absolute;
                height: 2px;
                width: 100%;
                bottom: 0;
                left: 0;
                background-color: blue;
                transform: scaleX(0);
                transition: transform 0.3s ease-in-out;

            }
            .nav1 a:hover::after {
                transform: scaleX(1);

            }
            
        
       .nav1 .Login-btn{
        background-color: blue;
        color: white;
        border: none;
        padding: 5px 15px;
        border-radius: 5px;
        cursor: pointer; 
        }

    





    </style>
    

</head>
<body>
    <div class="nav_container">
        <h2>Variation 1: Horizontal with underline effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="Login-btn"> logoin</button></li>
                

            </ul>

        </nav>

</div>


























    </div>

    
</body>
</html>
